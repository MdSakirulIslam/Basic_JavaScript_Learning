<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript with parameter</title>
    <script>
        var aa = 10;
        var bb = 10;
        function abc(a,b){
            document.write("Hello Everybody " + a +" "+ b);
        }
        abc("Good","Morning");

        function abcd(ab = "Kemon",ba = "aco"){
            document.write("<br>"+"Hello Everybody " + ab +" "+ ba);
        }
        abcd();

        function abcde(e,f){
            document.write(e+f);
        }
        abcde('<br>hi ','Hello');
        abcde(5,10);
    </script>
</head>
<body>

</body>
</html>
