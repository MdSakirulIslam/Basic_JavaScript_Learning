<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript For Loop</title>
    <script>
            var a = 1;
            var b = 20;
            document.write("<ul>")
            for(a;a<b;a++) {
                document.write(a+"<li>Hello</li>");
                a++;
            }


            document.write("</ul>")

    </script>
</head>
<body>

</body>
</html>
