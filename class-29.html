<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Break and Continue</title>
    <script>
            var a = 1; 
            var b = 20;

            for(a;a<=b;a++) {
                if (a==4){
                    // continue;
                    break;
                }
                document.write(a+"Hello <br>");

            }




    </script>
</head>
<body>

</body>
</html>
