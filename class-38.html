<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript array Methods pop push</title>
    <script>
        var array = ["hasan","rahman","basir","akram"];

    document.write( array + "<br>");
    array.pop();
        document.write( array + "<br>");
        array.push("Rahul");
        document.write( array + "<br>");


    </script>
</head>

</body>
</html>
