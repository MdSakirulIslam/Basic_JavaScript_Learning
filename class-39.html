<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript array Methods Shift Unshift</title>
    <script>
        var array = ["hasan","rahman","basir","akram"];

    document.write( array + "<br>");
    array.shift();
        document.write( array + "<br>");
        array.unshift("Rahul");
        document.write( array + "<br>");


    </script>
</head>
<body>

</body>
</html>
