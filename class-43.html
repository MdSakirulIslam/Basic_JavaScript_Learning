<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript array Methods indexOf() lastIndexOf()</title>
    <script>
        var a = ["hasan","rahman","kesa","shakil","sakib","shakil"];
        document.write( a.indexOf("rahman") + "<br><br>");
        var b = a.lastIndexOf("shakil");
        document.write(b+ "<br><br>");


    </script>
</head>

</body>
</html>
